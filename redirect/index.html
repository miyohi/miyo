
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #fff;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
}

svg {
  width: 52px;
  height: 52px;
  overflow: visible;
}

.arc {
  fill: none;
  stroke: url(#colors);
  stroke-width: 4;
  stroke-linecap: round;
}

.loading {
  font-family: "Fredoka", sans-serif;
  font-size: 17px;
  font-weight: 500;
  color: #5f6368;
  letter-spacing: .2px;
  cursor: default;
  user-select: none;
  -webkit-user-select: none;
}

.dots {
  display: inline;
}
</style>
</head>

<body>

<div class="container">

  <svg viewBox="0 0 52 52">
    <defs>
      <linearGradient id="colors">
        <stop offset="0%" stop-color="#EA4335">
          <animate
            attributeName="stop-color"
            values="#EA4335;#FBBC05;#34A853;#4285F4;#EA4335"
            dur="5s"
            repeatCount="indefinite"/>
        </stop>

        <stop offset="100%" stop-color="#FBBC05">
          <animate
            attributeName="stop-color"
            values="#FBBC05;#34A853;#4285F4;#EA4335;#FBBC05"
            dur="5s"
            repeatCount="indefinite"/>
        </stop>
      </linearGradient>
    </defs>

    <circle
      class="arc"
      cx="26"
      cy="26"
      r="21"/>
  </svg>

  <div class="loading">
    Loading<span class="dots">...</span>
  </div>

</div>

<script>
const arc = document.querySelector(".arc");

// ==========================
// SPINNER ROTATION
// ==========================

let angle = 0;
let lastTime = 0;

const speed = 0.25; // 0.25 độ/ms

function rotateSpinner(now) {
  const delta = lastTime ? now - lastTime : 0;
  lastTime = now;

  angle = (angle + speed * delta) % 360;

  arc.setAttribute(
    "transform",
    `rotate(${angle} 26 26)`
  );

  requestAnimationFrame(rotateSpinner);
}

requestAnimationFrame(rotateSpinner);

// ==========================
// RANDOM ARC LENGTH
// ==========================

let currentLength = 65;
let startLength = 65;
let targetLength = 65;

let animationStart = performance.now();
let animationDuration = 750;

function easeOutBack(t) {
  const c = 1.2;

  return 1 +
    (c + 1) * Math.pow(t - 1, 3) +
    c * Math.pow(t - 1, 2);
}

function animateLength(now) {
  let progress =
    (now - animationStart) / animationDuration;

  if (progress >= 1) {
    currentLength = targetLength;
    startLength = currentLength;

    targetLength = 35 + Math.random() * 80;

    animationStart = now;
    animationDuration = 600 + Math.random() * 700;

    progress = 0;
  }

  const eased = easeOutBack(
    Math.min(progress, 1)
  );

  currentLength =
    startLength +
    (targetLength - startLength) * eased;

  currentLength = Math.max(
    20,
    Math.min(120, currentLength)
  );

  arc.style.strokeDasharray =
    `${currentLength} ${132 - currentLength}`;

  requestAnimationFrame(animateLength);
}

requestAnimationFrame(animateLength);

// ==========================
// LOADING DOTS
// ==========================

const dots = document.querySelector(".dots");
let dotCount = 3;

setInterval(() => {
  dotCount = (dotCount + 1) % 4;
  dots.textContent = ".".repeat(dotCount);
}, 400);

// ==========================
// REDIRECT
// ==========================

const params = new URLSearchParams(location.search);
const destination = params.get("");

if (destination) {
  try {
    const target = new URL(destination, location.href);

    if (
      target.protocol === "https:" ||
      target.protocol === "http:"
    ) {
      setTimeout(() => {
        location.replace(target.href);
      }, 900);
    }
  } catch (error) {
    console.error("Invalid redirect URL:", error);
  }
}
</script>

</body>
</html>
