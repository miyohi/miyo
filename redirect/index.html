
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Loader</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

body{
  margin:0;
  width:100%;
  height:100vh;
  display:grid;
  place-items:center;
  background:#fff;
}

.container{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:13px;
}

svg{
  width:52px;
  height:52px;
}

.arc{
  fill:none;
  stroke:url(#colors);
  stroke-width:4;
  stroke-linecap:round;
}

.loading{
  font-family:"Fredoka",sans-serif;
  font-size:17px;
  font-weight:500;
  color:#5f6368;
  letter-spacing:.2px;
  user-select:none;
  -webkit-user-select:none;
  cursor:default;
}

.dots{
  display:inline;
}
</style>
</head>

<body>

<div class="container">

<svg viewBox="0 0 52 52">
<defs>
<linearGradient id="colors">
  <stop offset="0%" stop-color="#EA4335">
    <animate attributeName="stop-color"
      values="#EA4335;#FBBC05;#34A853;#4285F4;#EA4335"
      dur="5s" repeatCount="indefinite"/>
  </stop>
  <stop offset="100%" stop-color="#FBBC05">
    <animate attributeName="stop-color"
      values="#FBBC05;#34A853;#4285F4;#EA4335;#FBBC05"
      dur="5s" repeatCount="indefinite"/>
  </stop>
</linearGradient>
</defs>

<circle class="arc" cx="26" cy="26" r="21"/>
</svg>

<div class="loading">
  Loading<span class="dots">...</span>
</div>

</div>

<script>
const arc=document.querySelector(".arc");

// Độ dài cung co và bật ngẫu nhiên
let current=65;
let from=65;
let target=65;
let lengthStart=performance.now();
let lengthDuration=750;

function easeOutBack(t){
  const c=1.35;
  return 1+(c+1)*Math.pow(t-1,3)
         +c*Math.pow(t-1,2);
}

// Tốc độ xoay cố định: 0.25 độ/ms
let angle=0;
let last=0;
const speed=0.25;

function animate(now){
  const dt=last ? now-last : 0;
  last=now;

  angle=(angle+speed*dt)%360;

  // Co và bật dài
  let progress=(now-lengthStart)/lengthDuration;

  if(progress>=1){
    current=target;
    from=current;
    target=35+Math.random()*80;
    lengthStart=now;
    lengthDuration=600+Math.random()*700;
    progress=0;
  }

  current=from+(target-from)*
          easeOutBack(Math.min(progress,1));

  arc.style.strokeDasharray=
    `${current} ${132-current}`;

  arc.setAttribute(
    "transform",
    `rotate(${angle} 26 26)`
  );

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// Dấu chấm Loading...
const dots=document.querySelector(".dots");
let dotCount=3;

setInterval(()=>{
  dotCount=(dotCount+1)%4;
  dots.textContent=".".repeat(dotCount);
},400);

// Tải font Fredoka
document.fonts.load('500 17px "Fredoka"');

// Chuyển hướng qua ?=URL
const link=new URLSearchParams(location.search).get("=");

try{
  const url=new URL(link);

  if(url.protocol==="https:"||url.protocol==="http:"){
    setTimeout(()=>{
      location.replace(url.href);
    },1800);
  }
}catch{}
</script>

</body>
</html>
